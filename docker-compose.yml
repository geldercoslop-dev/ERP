name: erp

services:
  db:
    image: mysql:8
    container_name: erp-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: erp-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  api:
    build: .
    container_name: erp-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:${REDIS_PORT}
      JWT_SECRET: replace_with_secure_secret_minimum_32_chars_first_but_really_should_be_64_characters_long_for_production_security_requirements
      JWT_ACCESS_SECRET: replace_with_secure_secret_minimum_32_chars_second_but_really_should_be_64_characters_long_for_production_security_requirements
      JWT_REFRESH_SECRET: replace_with_secure_secret_minimum_32_chars_third_but_really_should_be_64_characters_long_for_production_security_requirements
      APP_SECRET: replace_with_secure_secret_minimum_32_chars_fourth_but_really_should_be_64_characters_long_for_production_security_requirements
      SESSION_SECRET: replace_with_secure_secret_minimum_32_chars_fifth_but_really_should_be_64_characters_long_for_production_security_requirements
    ports:
      - "3000:3000"
    command: pnpm start
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge

