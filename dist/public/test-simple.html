<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Simples de Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #6366f1; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #4f46e5; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; white-space: pre-wrap; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
        .info { background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>
    <h1>🔐 Teste Simples de Login</h1>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Usuário:</label>
            <input type="text" id="username" value="admin" required>
        </div>
        <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" value="admin123" required>
        </div>
        <button type="submit">🚀 Fazer Login</button>
        <button type="button" id="checkBtn">🔍 Verificar Sessão</button>
    </form>

    <div id="result"></div>

    <script>
        async function login(username, password) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result info';
            resultDiv.textContent = '🔄 Fazendo login...';
            
            try {
                console.log('Enviando requisição para:', 'http://127.0.0.1:3000/api/trpc/auth.login');
                console.log('Body:', JSON.stringify({
                    json: { username: username.trim(), password: password.trim() }
                }));
                
                const response = await fetch('http://127.0.0.1:3000/api/trpc/auth.login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        json: { username: username.trim(), password: password.trim() }
                    }),
                    credentials: 'include'
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const text = await response.text();
                console.log('Response text:', text);
                
                const data = JSON.parse(text);
                console.log('Parsed data:', data);
                
                if (data.result?.data?.json?.ok) {
                    const user = data.result.data.json;
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Login successful!\n\nUsuário: ${user.name}\nFunção: ${user.role}\nToken: ${user.sessionToken}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Login failed!\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                console.error('Erro completo:', error);
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Erro: ${error.message}\n\nStack: ${error.stack}`;
            }
        }

        async function checkSession() {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result info';
            resultDiv.textContent = '🔍 Verificando sessão...';
            
            try {
                const response = await fetch('http://127.0.0.1:3000/api/trpc/auth.me', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                console.log('Check session status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const text = await response.text();
                console.log('Check session text:', text);
                
                const data = JSON.parse(text);
                console.log('Check session data:', data);
                
                if (data.result?.data?.json) {
                    const user = data.result.data.json;
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Usuário autenticado!\n\nNome: ${user.name}\nFunção: ${user.role}\nEmail: ${user.email || 'N/A'}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '❌ Nenhum usuário autenticado';
                }
            } catch (error) {
                console.error('Erro na verificação:', error);
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Erro: ${error.message}`;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            login(username, password);
        });

        document.getElementById('checkBtn').addEventListener('click', checkSession);
    </script>
</body>
</html>
