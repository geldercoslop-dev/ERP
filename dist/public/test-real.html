<!DOCTYPE html>
<html>
<head>
    <title>Teste de Sistema Real</title>
</head>
<body>
    <h1>🔥 Teste de Sistema Real</h1>
    <div id="results"></div>
    
    <script>
async function runTests() {
    const results = document.getElementById('results');
    const log = (text) => {
        results.innerHTML += text + '<br>';
    };

    log('<h2>━━━━ TESTE 1 — AUTH (sem token) ━━━━</h2>');
    const resp1 = await fetch('http://localhost:3000/api/clientes');
    log(`Status: ${resp1.status}`);
    log(`Esperado: 401`);
    if (resp1.status === 401) {
        log('✔ TESTE 1 PASSOU<br>');
    } else {
        log('❌ TESTE 1 FALHOU<br>');
    }

    log('<h2>━━━━ TESTE 2 — LOGIN ━━━━</h2>');
    
    // Estratégia: sem nenhum secret (rota agora liberada no middleware)
    const login = await fetch('http://localhost:3000/api/trpc/auth.login', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            json: { username: 'admin', password: 'admin123' }
        }),
        credentials: 'include'
    });
    
    log(`Status: ${login.status}`);
    const loginData = await login.json().catch(() => ({}));
    log(`Response: ${JSON.stringify(loginData).substring(0, 200)}`);
    
    const token = loginData.result?.data?.json?.sessionToken;
    if (token) {
        log(`✔ TESTE 2 PASSOU`);
        log(`Token: ${token}<br>`);
        
        log('<h2>━━━━ TESTE 3 — REQUEST COM TOKEN ━━━━</h2>');
        const resp3 = await fetch('http://localhost:3000/api/clientes', {
            headers: {
                'Authorization': `Bearer ${token}`,
                'x-tenant-id': '1'
            }
        });
        log(`Status: ${resp3.status}`);
        log(`Esperado: 200`);
        if (resp3.status === 200) {
            log('✔ TESTE 3 PASSOU<br>');
        } else {
            log('❌ TESTE 3 FALHOU<br>');
        }
        
        log('<h2>━━━━ TESTE 4 — QUEBRA DE SEGURANÇA ━━━━</h2>');
        const resp4 = await fetch('http://localhost:3000/api/clientes', {
            headers: {
                'Authorization': `Bearer ${token}`,
                'x-tenant-id': '999'
            }
        });
        log(`Status: ${resp4.status}`);
        log(`Esperado: 403 ou 401`);
        if (resp4.status === 403 || resp4.status === 401) {
            log('✔ TESTE 4 PASSOU<br>');
        } else {
            log('❌ TESTE 4 FALHOU - FALHA CRÍTICA<br>');
        }
    } else {
        log('❌ TESTE 2 FALHOU<br>');
    }
}

runTests();
    </script>
</body>
</html>
