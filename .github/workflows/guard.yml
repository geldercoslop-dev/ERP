name: Architecture Guard

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm exec tsc -p tsconfig.server.json --noEmit

      - name: Architecture Guard
        run: node scripts/enforce-architecture.cjs

      - name: LEO Isolation Guard
        run: node scripts/enforce-leo-isolation.cjs

      - name: Drizzle Usage Check
        run: pnpm run verify:drizzle

      - name: Any Usage Check
        run: pnpm run verify:any

      - name: Architecture Check
        run: pnpm run verify:arch

      - name: Environment Check
        run: pnpm run verify:env

      - name: Build Test
        run: pnpm run build
