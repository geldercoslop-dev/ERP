name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm exec tsc -p tsconfig.server.json --noEmit
      - run: pnpm run verify:drizzle
      - run: pnpm run verify:any
      - run: pnpm run verify:arch
      - run: pnpm run verify:env
