name: CI

on:
  push:
    branches:
      - main
      - backup/*
      - fix/*
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run verify base (GUARDS OFICIAIS)
        run: pnpm verify:base
