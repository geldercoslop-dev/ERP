version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendas-app-prod
    restart: always
    mem_limit: 1g
    cpus: "1.0"
    working_dir: /app
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      vendas-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - vendas-network
    command: node dist/server/index.js

  vendas-mysql:
    image: mysql:8.0
    container_name: vendas-mysql-prod
    restart: always
    mem_limit: 2g
    cpus: "1.5"
    env_file:
      - .env.production
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - vendas-network

  redis:
    image: redis:7-alpine
    container_name: vendas-redis-prod
    restart: always
    mem_limit: 512m
    cpus: "0.5"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 10
      interval: 5s
    command: redis-server --appendonly yes
    networks:
      - vendas-network

volumes:
  mysql_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  vendas-network:
    driver: bridge
