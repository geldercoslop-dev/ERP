services:
  db:
    image: mysql:8
    container_name: erp-db-prod
    restart: always
    deploy:
      restart_policy:
        condition: on-failure
    env_file:
      - .env.production.lock
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DB_USER} -p${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - vendas-network

  redis:
    image: redis:7-alpine
    container_name: erp-redis-prod
    restart: always
    deploy:
      restart_policy:
        condition: on-failure
    env_file:
      - .env.production.lock
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - vendas-network

  api:
    image: erp-api:prod
    container_name: erp-api-prod
    restart: always
    deploy:
      restart_policy:
        condition: on-failure
    env_file:
      - .env.production.lock
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    command: node dist/server/index.js
    networks:
      - vendas-network

volumes:
  mysql_data_prod:
  redis_data_prod:

networks:
  vendas-network:
    driver: bridge
