version: '3.8'

services:
  # Jaeger all-in-one para desenvolvimento
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: erp-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "14250:14250"  # gRPC
      - "14268:14268"  # HTTP
      - "6831:6831/udp" # UDP
      - "6832:6832/udp" # UDP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - tracing-network

  # Prometheus opcional para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: erp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - tracing-network
    profiles:
      - metrics

networks:
  tracing-network:
    driver: bridge
