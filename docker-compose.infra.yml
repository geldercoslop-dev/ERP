services:
  vendas-mysql:
    # Usar 8.x alinhado ao datadir existente (8.0 sobre volume 8.4 falha com "Invalid MySQL server downgrade").
    image: mysql:8.4
    container_name: vendas-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      # Primeira init (InnoDB em volume vazio) pode levar vários minutos em disco lento; evita unhealthy/corte prematuro.
      start_period: 360s
    networks:
      - vendas-network

  redis:
    image: redis:7-alpine
    container_name: vendas-redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 10
      interval: 5s
    networks:
      - vendas-network

  # Backend dev: deps no build (Dockerfile.dev). Sem install no start.
  # docker compose -f docker-compose.infra.yml up -d
  # docker compose -f docker-compose.infra.yml logs -f app
  app:
    image: erp-app-dev:latest
    container_name: vendas-app
    restart: unless-stopped

    depends_on:
      vendas-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      DB_HOST: vendas-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: erp

      APP_SECRET: ${APP_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}

    ports:
      - "3000:3000"

    networks:
      - vendas-network

    command: sh -c "pnpm dev"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  vendas-network:
    driver: bridge
